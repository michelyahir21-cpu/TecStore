{% extends 'base.html' %} {% block content %}

<div class="container py-5">
  <div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-lg-5">
      <div class="card-custom">
        <div class="text-center mb-4">
          <h2 class="fw-bold">Iniciar Sesión</h2>

          <p class="text-light">Accede a tu cuenta institucional</p>
        </div>

        <form method="POST">
          <input
            type="text"
            name="login"
            class="form-control mb-3"
            placeholder="Correo o número de control"
            required
          />

          <input
            type="password"
            name="password"
            class="form-control mb-4"
            placeholder="Contraseña"
            required
          />

          <button type="submit" class="btn-register">Entrar</button>
        </form>

        <div class="text-center mt-4">
          <span class="text-light"> ¿No tienes cuenta? </span>

          <a href="/register" class="login-link"> Regístrate </a>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
